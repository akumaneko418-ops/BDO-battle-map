<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BDO Battle Map</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<div class="top-bar">
    <span class="title">BDO Battle Map</span>
</div>
    
<div class="page-container">

    <t>みんなで同じ画像をリアルタイム編集して保存できるよ</t><br>

    <!-- 新規作成 -->
    <button id="newBtn" class="new-create-btn">＋ 新規作成</button>

    <!-- 保存済み画像一覧 -->
    <div id="savedList"></div>

    <!-- プリセット画像管理 -->
    <div class="fold-header preset-header">
        <div class="left">
            <span class="fold-icon">▼</span> プリセット画像管理
        </div>

        <!-- ★ stopPropagation() を追加してタブ開閉を防止 -->
        <button id="addPresetBtn" class="right-btn" onclick="event.stopPropagation();">
            ＋追加
        </button>

        <input type="file" id="presetFileInput" accept="image/png" style="display:none;">
    </div>

    <div class="fold-content" id="presetList"></div>

</div>

<script src="index.js"></script>

</body>
</html>
