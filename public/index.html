<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>BDO Battle Map - Image List</title>
<link rel="stylesheet" href="index.css">
</head>
<body>

<h1>BDO Battle Map</h1>

<button id="newCreateBtn" class="primary-btn">＋ 新規作成</button>

<!-- ====================== 保存済み画像 ====================== -->
<div class="fold-header">
    <span class="fold-icon">▼</span> 保存済み画像
</div>
<div class="fold-content" id="savedImages"></div>

<!-- ====================== プリセット画像管理 ====================== -->
<div class="fold-header preset-header">
    <span class="fold-icon">▼</span> プリセット画像管理
    <button id="addPresetBtn" class="right-btn">＋追加</button>
    <input type="file" id="presetFileInput" accept="image/png" style="display:none;">
</div>

<div class="fold-content" id="presetList"></div>

<script src="index.js"></script>
</body>
</html>
