<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BDO Battle Map</title>
  <style>
    body { margin: 0; }
    canvas { background: #eee; display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <canvas id="canvas" width="800" height="600"></canvas>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let drawing = false;

    canvas.addEventListener("mousedown", () => drawing = true);
    canvas.addEventListener("mouseup", () => drawing = false);
    canvas.addEventListener("mousemove", draw);

    function draw(e) {
      if (!drawing) return;

      const x = e.offsetX;
      const y = e.offsetY;

      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();

      socket.emit("draw", { x, y });
    }

    socket.on("draw", (data) => {
      ctx.fillStyle = "blue";
      ctx.beginPath();
      ctx.arc(data.x, data.y, 5, 0, Math.PI * 2);
      ctx.fill();
    });

    /* ===== コメント機能 ===== */

    const chatInput = document.getElementById("chatInput");
    const nicknameInput = document.getElementById("nickname");
    const sendChat = document.getElementById("sendChat");
    const chatLog = document.getElementById("chatLog");

    sendChat.addEventListener("click", () => {
      const nickname = nicknameInput.value.trim();
      const message = chatInput.value.trim();
      if (!nickname || !message) return;

      const data = {
        nickname,
        message,
        timestamp: Date.now()
      };

      socket.emit("chat", data);
      chatInput.value = "";
    });

    socket.on("chat", (data) => {
      const time = new Date(data.timestamp).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
      const div = document.createElement("div");
      div.textContent = `${data.nickname}（${time}）: ${data.message}`;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    });
  </script>

  <div style="width: 800px; margin: 20px auto; font-family: sans-serif;">
    <h3>コメント</h3>

    <div>
      <input id="nickname" type="text" placeholder="ニックネーム" style="width: 200px;">
      <input id="chatInput" type="text" placeholder="コメントを入力" style="width: 400px;">
      <button id="sendChat">送信</button>
    </div>

    <div id="chatLog"
         style="margin-top: 15px; padding: 10px; background: #f5f5f5; height: 200px; overflow-y: scroll;">
    </div>
  </div>
</body>
</html>
