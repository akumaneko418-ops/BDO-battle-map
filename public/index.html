<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BDO Battle Map</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<div class="top-bar">
    <span class="title">BDO Battle Map</span>
</div>
    
<div class="page-container">
<t>みんなで同じ画像をリアルタイム編集して保存できるよ</t><br>
   <button id="newBtn" class="big-new-btn">＋ 新規作成</button>
<select id="categoryFilter">
    <option value="all">すべて</option>
    <option value="バレノス">バレノス</option>
    <option value="セレンディア">セレンディア</option>
    <option value="カルフェオン">カルフェオン</option>
    <!-- 必要に応じて追加 -->
</select>

    <!-- 保存済み画像一覧 -->
<div id="savedList"></div>

    <!-- プリセット画像管理 -->
    <div class="fold-header preset-header">
        <div class="left">
            <span class="fold-icon">▼</span> プリセット画像管理
        </div>
        <button id="addPresetBtn" class="right-btn">＋追加</button>
        <input type="file" id="presetFileInput" accept="image/png" style="display:none;">
    </div>

    <div class="fold-content" id="presetList"></div>

</div>

<!-- JS は必ず最後に読み込む -->
<script src="index.js"></script>

</body>
</html>
