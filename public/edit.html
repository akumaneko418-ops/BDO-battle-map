<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BDO Battle Map Editor</title>
    <link rel="stylesheet" href="edit.css">
</head>
<body>

<div class="top-bar">
    <h2>BDO Battle Map Editor</h2>
</div>

<div class="canvas-toolbar">

    <input id="fileNameInput" value="無題" class="fileNameInput">

    <select id="presetSelect">
        <option value="">プリセット画像を選択</option>
        <option value="/presets/sample_map.png">sample_map.png</option>
        <!-- ここに追加すればプリセットが増える
        <option value="/presets/your_map.png">your_map.png</option>
        -->
    </select>

    <button id="undoBtn" class="disabled">ひとつ戻す</button>
    <button id="redoBtn" class="disabled">ひとつ進む</button>

    <button id="zoomInBtn">＋</button>
    <button id="zoomOutBtn">－</button>
    <button id="zoomResetBtn">100%</button>

    <button id="saveAllBtn">全体を保存</button>
</div>

<div class="main-container">

    <div class="canvas-area">
        <div id="dropHint">ここに画像をドラッグ＆ドロップしてアップロード</div>
        <canvas id="mapCanvas" width="1600" height="900"></canvas>
    </div>

    <div class="right-panel">

        <h3 class="fold-header" data-target="markerSection">
            砦マーカー <span class="fold-icon">▲</span>
        </h3>
        <div id="markerSection" class="fold-content">

            <div class="markerNameWrapper help-wrapper">
                <input id="markerName" placeholder="例：A / B / C">
                <span class="help-icon">?</span>
                <div class="help-popup global-help">マーカー内の文字を追加</div>
            </div>

            <div class="colorPicker">
                <div class="colorOption" style="background:#ff7eb9"></div>
                <div class="colorOption" style="background:#7ed6ff"></div>
                <div class="colorOption" style="background:#fff47e"></div>
            </div>

            <div class="opacityPicker">
                <span>透明度</span>
                <input type="range" id="markerOpacity" min="0" max="1" step="0.01" value="1">
                <span id="markerOpacityValue">1.00</span>
            </div>
        </div>

        <hr>

        <h3 class="fold-header" data-target="arrowSection">
            矢印スタンプ <span class="fold-icon">▲</span>
        </h3>
        <div id="arrowSection" class="fold-content">

            <div class="arrowColorPicker">
                <div class="arrowColorOption" style="background:#ff7eb9"></div>
                <div class="arrowColorOption" style="background:#7ed6ff"></div>
                <div class="arrowColorOption" style="background:#fff47e"></div>
            </div>

            <div class="arrowOpacityPicker">
                <span>透明度</span>
                <input type="range" id="arrowOpacity" min="0" max="1" step="0.01" value="1">
                <span id="arrowOpacityValue">1.00</span>
            </div>
        </div>

        <hr>

        <h3 class="fold-header" data-target="textSection">
            テキスト <span class="fold-icon">▲</span>
        </h3>
        <div id="textSection" class="fold-content">

            <div class="textColorPicker">
                <div class="textColorOption" style="background:#ff7eb9"></div>
                <div class="textColorOption" style="background:#7ed6ff"></div>
                <div class="textColorOption" style="background:#fff47e"></div>
            </div>

            <div class="textSizePicker">
                <span>文字サイズ</span>
                <input type="range" id="textSize" min="16" max="28" step="1" value="16">
            </div>

            <div class="textAddButtonWrapper help-wrapper">
                <button id="addTextModeBtn">テキスト追加モード</button>
                <span class="help-icon">?</span>
                <div class="help-popup global-help">キャンバスをクリックしてテキストを入力</div>
            </div>
        </div>

        <hr>

        <h3 class="fold-header" data-target="penSection">
            ペンツール <span class="fold-icon">▲</span>
        </h3>
        <div id="penSection" class="fold-content">

            <div class="penColorPicker">
                <div class="penColorOption" style="background:#ff7eb9"></div>
                <div class="penColorOption" style="background:#7ed6ff"></div>
                <div class="penColorOption" style="background:#fff47e"></div>
            </div>

            <div class="penWidthPicker">
                <span>太さ</span>
                <select id="penWidth">
                    <option value="1">1px</option>
                    <option value="3">3px</option>
                    <option value="5">5px</option>
                    <option value="8">8px</option>
                </select>
            </div>

            <div class="penOpacityPicker">
                <span>透明度</span>
                <input type="range" id="penOpacity" min="0" max="1" step="0.01" value="1">
                <span id="penOpacityValue">1.00</span>
            </div>

            <button id="penModeBtn">ペン ON/OFF</button>
            <button id="penClearBtn">線を消す</button>
        </div>

        <hr>

        <h3 class="fold-header" data-target="commentSection">
            コメント <span class="fold-icon">▲</span>
        </h3>
        <div id="commentSection" class="fold-content">
            <div id="commentList"></div>
        </div>

    </div>
</div>

<div id="markerMenu" class="contextMenu hidden">
    <div id="addCommentBtn">コメント追加</div>
    <div id="deleteMarkerBtn">削除</div>
</div>

<div id="textMenu" class="contextMenu hidden">
    <div id="editTextBtn">編集</div>
    <div id="deleteTextBtn">削除</div>
</div>

<div id="arrowMenu" class="contextMenu hidden">
    <div id="arrowRotateBtn">回転</div>
    <div id="arrowScaleUpBtn">拡大</div>
    <div id="arrowScaleDownBtn">縮小</div>
    <div id="arrowDeleteBtn">削除</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="edit_v2.js"></script>

</body>
</html>
