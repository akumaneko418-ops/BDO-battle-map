<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BDO Battle Map Editor</title>
    <link rel="stylesheet" href="edit.css">
</head>
<body>

<!-- 上部黒バー -->
<div class="top-bar">
    <span class="title">BDO Battle Map Editor</span>

    <!-- 右端リンク -->
    <a href="index.html" class="top-link">TOP画面へ</a>
</div>

<!-- ツールバー（白） -->
<div class="canvas-toolbar">

    <!-- ファイル名入力欄 -->
<div class="fileNameArea">
    <select id="categorySelect" class="categorySelect">
        <option value="バレノス">バレノス</option>
        <option value="セレンディア">セレンディア</option>
        <option value="カルフェオン">カルフェオン</option>
        <option value="メディア">メディア</option>
        <option value="バレンシア">バレンシア</option>
        <option value="カーマスリビア">カーマスリビア</option>
        <option value="ウルキタ">ウルキタ</option>
    </select>

    <input id="fileNameInput" class="fileNameInput" placeholder="MAPの名前">
</div>


    <!-- 戻る・進む -->
    <button id="undoBtn">戻る</button>
    <button id="redoBtn">進む</button>

    <!-- ズーム -->
    <button id="zoomOutBtn">－</button>
    <button id="zoomInBtn">＋</button>
    <button id="zoomResetBtn">100%表示</button>

    <!-- PNG出力 -->
    <button id="exportPngBtn">ダウンロード</button>

    <!-- サーバーに保存 -->
    <button id="saveAllBtn" class="saveButton">画像を保存</button>

</div>

<!-- メイン領域 -->
<div class="main-container">

    <!-- キャンバス側 -->
    <div class="canvas-area">
        <canvas id="mapCanvas" width="1600" height="1200"></canvas>
        <div id="dropHint">画像をここにドロップ</div>
    </div>

    <!-- 右パネル -->
    <div class="right-panel">
        
        <!-- 砦マーカー設定 -->
        <div class="fold-header">
            <div class="left-group">
                <span class="section-title">砦マーカー</span>
                <span class="help-btn">
                    ？
                    <span class="tooltip">砦位置をマーキングする</span>
                </span>
            </div>
            <span class="fold-icon">▼</span>
        </div>

        <div class="fold-content">

            <div class="markerNameWrapper compact-row">
                <label for="markerName">砦の名前</label>
                <input id="markerName" type="text" placeholder="砦の名前">
            </div>

            <div class="colorPicker compact-row">
                <span>色</span>
                <div class="colorOption" style="background:#ff7eb9"></div>
                <div class="colorOption" style="background:#7ed6ff"></div>
                <div class="colorOption" style="background:#fff47e"></div>
            </div>

            <div class="compact-row">
                <label for="markerSizeSlider">サイズ</label>
                <input id="markerSizeSlider" type="range" min="5" max="40" value="10">
            </div>

            <div class="compact-row">
                <label for="markerOpacitySlider">不透明度</label>
                <input id="markerOpacitySlider" type="range" min="0.1" max="1" step="0.05" value="1">
                <span id="markerOpacityValue">1.00</span>
            </div>
        </div>

        <!-- 矢印スタンプ -->
        <div class="fold-header">
            <span>矢印スタンプ</span><span class="fold-icon">▼</span>
        </div>
        <div class="fold-content">

            <div class="arrowColorPicker compact-row">
                <span>色</span>
                <div class="arrowColorOption" style="background:#ff7eb9"></div>
                <div class="arrowColorOption" style="background:#7ed6ff"></div>
                <div class="arrowColorOption" style="background:#fff47e"></div>
            </div>

            <div class="compact-row">
                <label for="arrowSizeSlider">サイズ</label>
                <input id="arrowSizeSlider" type="range" min="0.5" max="3" step="0.1" value="1">
            </div>

            <div class="compact-row">
                <label for="arrowOpacitySlider">不透明度</label>
                <input id="arrowOpacitySlider" type="range" min="0.1" max="1" step="0.05" value="1">
                <span id="arrowOpacityValue">1.00</span>
            </div>

        </div>
        
        <!-- テキスト設定 -->
        <div class="fold-header">
            <span>テキスト設定</span><span class="fold-icon">▼</span>
        </div>
        <div class="fold-content">

            <div class="textColorPicker compact-row">
                <span>色</span>
                <div class="textColorOption" style="background:#ff7eb9"></div>
                <div class="textColorOption" style="background:#7ed6ff"></div>
                <div class="textColorOption" style="background:#fff47e"></div>
            </div>

            <div class="compact-row">
                <label for="textSizeSlider">サイズ</label>
                <input id="textSizeSlider" type="range" min="10" max="40" value="16">
            </div>
        </div>

        <!-- ペン設定 -->
        <div class="fold-header">
            <span>ペン設定</span><span class="fold-icon">▼</span>
        </div>
        <div class="fold-content">

            <div class="penColorPicker compact-row">
                <span>色</span>
                <div class="penColorOption" style="background:#ff7eb9"></div>
                <div class="penColorOption" style="background:#7ed6ff"></div>
                <div class="penColorOption" style="background:#fff47e"></div>
            </div>

            <div class="compact-row">
                <label for="penOpacitySlider">不透明度</label>
                <input id="penOpacitySlider" type="range" min="0.1" max="1" step="0.05" value="1">
                <span id="penOpacityValue">1.00</span>
            </div>

            <div class="compact-row">
                <label for="penWidthSlider">太さ</label>
                <input id="penWidthSlider" type="range" min="1" max="10" value="3">
            </div>

            <button id="penClearBtn">ペンを全消去</button>
        </div>

        <!-- コメント欄 -->
        <h3>コメント</h3>
        <div id="commentList"></div>

    </div>
</div>

<!-- 右クリックメニュー -->
<div id="markerMenu" class="contextMenu hidden">
    <div id="addCommentBtn">コメント追加</div>
    <div id="deleteMarkerBtn">削除</div>
</div>

<div id="arrowMenu" class="contextMenu hidden">
    <div id="arrowRotateLeftBtn">左回転</div>
    <div id="arrowRotateRightBtn">右回転</div>
    <div id="arrowDeleteBtn">削除</div>
</div>

<div id="textMenu" class="contextMenu hidden">
    <div id="deleteTextBtn">削除</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="edit_v2.js"></script>

</body>
</html>
