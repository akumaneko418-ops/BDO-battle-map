<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画像編集</title>

    <!-- style.css は存在しないので削除済み -->
    <link rel="stylesheet" href="/edit.css">
</head>
<body>

    <!-- 上段：タイトル入力 + 保存ボタン -->
    <div class="top-bar">
        <input id="imageTitle" placeholder="編集画像の名前">
        <button id="saveImageBtn">保存</button>
    </div>

    <!-- 下段：左右2分割 -->
    <div class="main-area">

        <!-- 左：メインキャンバス（画像＋マーカー）-->
        <div class="canvas-area">
            <canvas id="mapCanvas" width="800" height="600"></canvas>
        </div>

        <!-- 右：ツールバー + コメント欄 -->
        <div class="right-panel">

            <!-- ツールバー -->
            <div class="toolbar">
                <h3>マーカー設定</h3>

                <!-- ？ボタンの位置を左に移動 -->
                <div class="markerNameInput">
                    <span>マーカー名？：</span>
                    <input id="markerName" placeholder="例：A/B/C/D">
                </div>

                <!-- 色選択（？ボタン位置修正） -->
                <div class="colorPicker">
                    <span>色？：</span>
                    <div id="pink" class="colorOption" style="background:#ff7eb9"></div>
                    <div id="blue" class="colorOption" style="background:#7ed6ff"></div>
                    <div id="yellow" class="colorOption" style="background:#fff47e"></div>
                </div>

                <!-- 保存：と一覧：は完全削除済み -->
            </div>

            <!-- コメント欄 -->
            <div class="comment-area">
                <h3>コメント</h3>
                <input id="nickname" placeholder="ニックネーム">
                <input id="message" placeholder="コメント">
                <button id="sendBtn">送信</button>
            </div>

        </div>
    </div>

    <div id="tooltip"></div>

    <!-- ? ホバー説明用ツールチップ -->
    <div id="helpTooltip" class="help-tooltip hidden"></div>

    <!-- マーカー右クリックメニュー -->
    <div id="markerMenu" class="marker-menu hidden">
        <div id="addCommentBtn">コメント追加</div>
        <div id="deleteMarkerBtn">マーカー削除</div>
    </div>

    <!-- ★ DOM の最後に script を移動（null エラー防止） -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/edit_v2.js"></script>

    <script>
        document.querySelectorAll(".help-icon").forEach(icon => {
            icon.addEventListener("mouseenter", (e) => {
                const tip = document.getElementById("helpTooltip");
                tip.textContent = icon.dataset.help;
                tip.style.left = (e.pageX + 10) + "px";
                tip.style.top = (e.pageY + 10) + "px";
                tip.classList.remove("hidden");
            });

            icon.addEventListener("mouseleave", () => {
                document.getElementById("helpTooltip").classList.add("hidden");
            });
        });
    </script>

</body>
</html>
