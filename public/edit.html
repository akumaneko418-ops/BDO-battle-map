<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>画像編集</title>
    <link rel="stylesheet" href="/edit.css">
</head>
<body>

    <!-- 上段：タイトル入力 + 保存ボタン -->
    <div class="top-bar">
        <input id="imageTitle" placeholder="編集画像の名前">
        <button id="saveImageBtn">保存</button>
    </div>

    <!-- 下段：左右2分割 -->
    <div class="main-area">

        <!-- 左：メインキャンバス -->
        <div class="canvas-area">
            <canvas id="mapCanvas" width="800" height="600"></canvas>
        </div>

        <!-- 右：ツールバー + コメント一覧 -->
        <div class="right-panel">

            <!-- マーカー設定 -->
            <div class="toolbar">
                <h3>マーカー設定</h3>

                <div class="markerNameInput">
                    <span>マーカー名：</span>
                    <span class="help-icon" data-help="マーカーの中に表示される名前です（例：A/B/C/D）">?</span>
                    <input id="markerName" placeholder="例：A/B/C/D">
                </div>

                <div class="colorPicker">
                    <span>色：</span>
                    <span class="help-icon" data-help="マーカーの色を選びます">?</span>
                    <div id="pink" class="colorOption" style="background:#ff7eb9"></div>
                    <div id="blue" class="colorOption" style="background:#7ed6ff"></div>
                    <div id="yellow" class="colorOption" style="background:#fff47e"></div>
                </div>

                <!-- テキスト追加 -->
                <h3>テキスト追加</h3>

                <div class="textColorPicker">
                    <span>色：</span>
                    <span class="help-icon" data-help="テキストの色を選びます">?</span>
                    <div id="textWhite" class="textColorOption" style="background:#ffffff"></div>
                    <div id="textBlack" class="textColorOption" style="background:#000000"></div>
                    <div id="textYellow" class="textColorOption" style="background:#ffff66"></div>
                </div>

                <div class="textSizePicker">
                    <span>文字サイズ：</span>
                    <span class="help-icon" data-help="テキストの大きさを選びます">?</span>
                    <select id="textSize">
                        <option value="16">16px</option>
                        <option value="20">20px</option>
                        <option value="24">24px</option>
                        <option value="28">28px</option>
                    </select>
                </div>
