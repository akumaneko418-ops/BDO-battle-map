<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>BDO Battle Map Editor</title>
    <link rel="stylesheet" href="edit.css">
</head>
<body>

<div id="toolbar">

    <!-- マーカー名 -->
    <input id="markerName" type="text" placeholder="マーカー名" />

    <!-- ツールボタン -->
    <button id="markerModeBtn">マーカー</button>
    <button id="arrowModeBtn">矢印</button>
    <button id="penModeBtn">ペン</button>
    <button id="addTextModeBtn">テキスト</button>
    <button id="panModeBtn">移動</button>

    <!-- Undo / Redo -->
    <button id="undoBtn">Undo</button>
    <button id="redoBtn">Redo</button>

    <!-- PNG 出力 -->
    <button id="exportPngBtn">PNG</button>

    <!-- ズーム -->
    <button id="zoomInBtn">＋</button>
    <button id="zoomOutBtn">－</button>
    <button id="zoomResetBtn">リセット</button>

    <!-- 色選択 -->
    <div class="colorGroup">
        <div class="colorOption" style="background:#ff7eb9"></div>
        <div class="colorOption" style="background:#ff65a3"></div>
        <div class="colorOption" style="background:#7afcff"></div>
        <div class="colorOption" style="background:#feff9c"></div>
        <div class="colorOption" style="background:#fff740"></div>
    </div>

    <!-- 矢印色 -->
    <div class="arrowColorGroup">
        <div class="arrowColorOption" style="background:#ff7eb9"></div>
        <div class="arrowColorOption" style="background:#ff65a3"></div>
        <div class="arrowColorOption" style="background:#7afcff"></div>
        <div class="arrowColorOption" style="background:#feff9c"></div>
        <div class="arrowColorOption" style="background:#fff740"></div>
    </div>

    <!-- テキスト色 -->
    <div class="textColorGroup">
        <div class="textColorOption" style="background:#000"></div>
        <div class="textColorOption" style="background:#ff0000"></div>
        <div class="textColorOption" style="background:#00ff00"></div>
        <div class="textColorOption" style="background:#0000ff"></div>
    </div>

    <!-- ペン色 -->
    <div class="penColorGroup">
        <div class="penColorOption" style="background:#ff7eb9"></div>
        <div class="penColorOption" style="background:#ff65a3"></div>
        <div class="penColorOption" style="background:#7afcff"></div>
        <div class="penColorOption" style="background:#feff9c"></div>
        <div class="penColorOption" style="background:#fff740"></div>
    </div>

    <!-- サイズスライダー -->
    <div class="sliderGroup">
        <label>マーカーサイズ</label>
        <input id="markerSizeSlider" type="range" min="5" max="40" value="10">

        <label>矢印サイズ</label>
        <input id="arrowSizeSlider" type="range" min="0.5" max="3" step="0.1" value="1">
    </div>

</div>

<!-- キャンバス -->
<div id="canvasWrapper">
    <canvas id="mapCanvas" width="1600" height="1200"></canvas>
    <div id="dropHint">画像をここにドロップ</div>
</div>

<!-- ★ 右クリックメニュー（新規追加） -->
<div id="markerMenu" class="contextMenu hidden">
    <button id="deleteMarkerBtn">削除</button>
</div>

<div id="arrowMenu" class="contextMenu hidden">
    <button id="arrowRotateLeftBtn">左回転</button>
    <button id="arrowRotateRightBtn">右回転</button>
    <button id="arrowDeleteBtn">削除</button>
</div>

<div id="textMenu" class="contextMenu hidden">
    <button id="deleteTextBtn">削除</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="edit_v2.js"></script>

</body>
</html>
